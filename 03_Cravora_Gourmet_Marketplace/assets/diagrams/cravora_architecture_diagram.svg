<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="url(#bg)"/>
  
  <text x="50" y="45" fill="#F87171" font-family="Arial, sans-serif" font-size="20" font-weight="bold">CRAVORA — MULTI-TENANT GOURMET MARKETPLACE & CLOUD KITCHEN ARCHITECTURE</text>
  <text x="50" y="70" fill="#94A3B8" font-family="Arial, sans-serif" font-size="12">Multi-Role Workspace Switcher, Atomic Coupon Validation & DynamoDB Order Lifecycle • Designed by Yasir Khan</text>

  <!-- Box 1: Multi-Role Mobile Client -->
  <rect x="40" y="110" width="270" height="440" rx="12" fill="#0A0F1D" stroke="#F87171" stroke-width="1.5"/>
  <rect x="40" y="110" width="270" height="35" rx="12" fill="url(#redGrad)"/>
  <text x="55" y="133" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14" font-weight="bold">1. MULTI-ROLE CLIENT TIER</text>
  
  <rect x="55" y="160" width="240" height="75" rx="8" fill="#0F172A" stroke="#1E293B"/>
  <text x="70" y="185" fill="#F87171" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Customer Experience</text>
  <text x="70" y="205" fill="#94A3B8" font-family="Arial, sans-serif" font-size="10">Michelin-grade Curated Menu Discovery</text>
  <text x="70" y="220" fill="#94A3B8" font-family="Arial, sans-serif" font-size="10">Live Courier ETA (16 mins • 0.9km)</text>

  <rect x="55" y="250" width="240" height="75" rx="8" fill="#0F172A" stroke="#1E293B"/>
  <text x="70" y="275" fill="#F87171" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Kitchen Partner Portal</text>
  <text x="70" y="295" fill="#94A3B8" font-family="Arial, sans-serif" font-size="10">Self-Serve Chef Registration</text>
  <text x="70" y="310" fill="#94A3B8" font-family="Arial, sans-serif" font-size="10">Menu, Radius & Voucher Setup</text>

  <rect x="55" y="340" width="240" height="75" rx="8" fill="#0F172A" stroke="#1E293B"/>
  <text x="70" y="365" fill="#F87171" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Courier / Rider & Admin Mode</text>
  <text x="70" y="385" fill="#94A3B8" font-family="Arial, sans-serif" font-size="10">Live Route Navigation & Pickup</text>
  <text x="70" y="400" fill="#94A3B8" font-family="Arial, sans-serif" font-size="10">Platform Revenue & Order Settlement</text>

  <rect x="55" y="430" width="240" height="100" rx="8" fill="#0F172A" stroke="#1E293B"/>
  <text x="70" y="455" fill="#FBBF24" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Theme & Animation Engine</text>
  <text x="70" y="475" fill="#94A3B8" font-family="Arial, sans-serif" font-size="10">Dark Luxury Appearance Switcher</text>
  <text x="70" y="490" fill="#94A3B8" font-family="Arial, sans-serif" font-size="10">Custom Micro-Interactions</text>

  <!-- Box 2: AWS Backend Services -->
  <rect x="360" y="110" width="270" height="440" rx="12" fill="#0A0F1D" stroke="#6366F1" stroke-width="1.5"/>
  <rect x="360" y="110" width="270" height="35" rx="12" fill="url(#redGrad)"/>
  <text x="375" y="133" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14" font-weight="bold">2. AWS CLOUD BACKEND</text>

  <rect x="375" y="160" width="240" height="90" rx="8" fill="#0F172A" stroke="#1E293B"/>
  <text x="390" y="185" fill="#A855F7" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Amazon API Gateway</text>
  <text x="390" y="205" fill="#94A3B8" font-family="Arial, sans-serif" font-size="10">Multi-tenant REST endpoints</text>
  <text x="390" y="222" fill="#94A3B8" font-family="Arial, sans-serif" font-size="10">Role-based Access Authorizers</text>

  <rect x="375" y="270" width="240" height="150" rx="8" fill="#0F172A" stroke="#1E293B"/>
  <text x="390" y="295" fill="#A855F7" font-family="Arial, sans-serif" font-size="12" font-weight="bold">EC2 Order State Machine</text>
  <text x="390" y="315" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="10">• Placed ➔ Accepted ➔ In Kitchen</text>
  <text x="390" y="332" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="10">• Dispatched ➔ Delivered State Engine</text>
  <text x="390" y="349" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="10">• Atomic Voucher Deduction Engine</text>
  <text x="390" y="366" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="10">• Dynamic Delivery Radius Geocoder</text>
  <text x="390" y="395" fill="#34D399" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Order Latency: &lt; 25ms</text>

  <!-- Box 3: DynamoDB Persistence -->
  <rect x="680" y="110" width="280" height="440" rx="12" fill="#0A0F1D" stroke="#10B981" stroke-width="1.5"/>
  <rect x="680" y="110" width="280" height="35" rx="12" fill="url(#emeraldGrad)"/>
  <text x="695" y="133" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14" font-weight="bold">3. DYNAMODB TABLES</text>

  <rect x="695" y="160" width="250" height="120" rx="8" fill="#0F172A" stroke="#1E293B"/>
  <text x="710" y="185" fill="#34D399" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Merchant & Voucher Table</text>
  <text x="710" y="205" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="10">PK: STORE#&lt;id&gt; | SK: VOUCHER#TRUFFLE20</text>
  <text x="710" y="222" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="10">Discount: 20% | MinSpend: $35.00</text>
  <text x="710" y="239" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="10">Atomic Counter for Quota Deductions</text>

  <rect x="695" y="300" width="250" height="120" rx="8" fill="#0F172A" stroke="#1E293B"/>
  <text x="710" y="325" fill="#34D399" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Orders & Tracking Table</text>
  <text x="710" y="345" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="10">PK: ORDER#&lt;id&gt; | SK: STATUS#ACTIVE</text>
  <text x="710" y="362" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="10">Items: [Black Truffle Imperial: $17.50]</text>
  <text x="710" y="379" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="10">Live Courier Lat/Lng Telemetry</text>
</svg>
